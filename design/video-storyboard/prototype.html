<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.65 var(--font-sans,system-ui);color:var(--foreground,#242424)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ring,#888);outline-offset:2px}button{border:1px solid var(--border,#ddd);background:var(--card,#fff);color:inherit;border-radius:10px;padding:8px 14px}button.primary{background:var(--primary,#262626);color:var(--primary-foreground,#fff);border-color:transparent}p{margin:6px 0}.muted{color:var(--muted-foreground,#737373)}.shell{border:1px solid var(--border,#ddd);border-radius:16px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border,#ddd)}.brand{font-size:17px;font-weight:700}.tabs{display:flex;gap:6px}.tabs button[aria-pressed=true]{background:var(--secondary,#eee);font-weight:650}.main{padding:20px 16px}.thread{max-width:640px;margin:auto;min-width:0}.user{max-width:85%;margin:0 0 22px auto;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--secondary,#eee);width:fit-content}.identity{font-weight:650;margin-bottom:6px}.plan{border:1px solid var(--border,#ddd);border-radius:14px;margin:14px 0 22px;overflow:hidden;background:var(--card,#fff)}.planhead{padding:14px 16px;border-bottom:1px solid var(--border,#ddd);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.shots{padding:0 16px}.shot{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--border,#ddd)}.shot:last-child{border:0}.time{font-variant-numeric:tabular-nums;color:var(--muted-foreground,#777);padding-top:4px}.shot label{display:block;font-size:12px;color:var(--muted-foreground,#777)}textarea{resize:vertical;width:100%;padding:7px 9px;background:var(--background,transparent);color:inherit;border:1px solid var(--border,#ddd);border-radius:8px;line-height:1.6}.options{padding:14px 16px;background:var(--muted,transparent);display:flex;gap:12px;flex-wrap:wrap}select{background:var(--card,#fff);color:inherit;border:1px solid var(--border,#ddd);padding:7px;border-radius:8px;max-width:100%}.actions{padding:14px 16px;border-top:1px solid var(--border,#ddd);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.composer{border:1px solid var(--border,#ddd);border-radius:16px;padding:10px;background:var(--card,#fff)}.composer textarea{border:0;background:transparent;min-height:70px}.composerfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{font-size:12px;color:var(--muted-foreground,#777)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{display:block;text-align:left;padding:0;overflow:hidden;border-radius:12px}.thumb{aspect-ratio:1.25;display:grid;place-items:center;background:var(--secondary,#eee);position:relative}.thumb svg{width:38px;height:38px;stroke:var(--muted-foreground,#888);fill:none;stroke-width:1.4}.tile p{padding:8px 10px;margin:0}.badge{position:absolute;bottom:8px;right:8px;background:var(--card,#fff);border-radius:6px;font-size:12px;padding:2px 7px}.filters{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.filters button[aria-pressed=true]{background:var(--secondary,#eee)}[hidden]{display:none!important}.notice{border:1px solid var(--border,#ddd);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:14px}.player{border:1px solid var(--border,#ddd);border-radius:12px;padding:16px;margin-top:16px}.player .screen{aspect-ratio:16/9;background:var(--secondary,#eee);display:grid;place-items:center;text-align:center;padding:16px}.annotation{margin:12px 0;font-size:12px;color:var(--muted-foreground,#777)}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{padding:6px 10px}.bar{padding:12px}.main{padding:18px 12px}.shot{grid-template-columns:44px 1fr;gap:6px}.actions .primary{width:100%}}
</style></head><body><p class="annotation">交互样板 · 示例分镜与作品，无真实生成或扣费。可修改分镜、切换画廊及筛选。</p><section class="shell"><header class="bar"><span class="brand">剑来 · 视频</span><nav class="tabs" aria-label="样板视图"><button id="videoTab" aria-pressed="true" onclick="view('video')">对话</button><button id="galleryTab" aria-pressed="false" onclick="view('gallery')">作品</button></nav></header>
<main class="main"><section id="video" class="thread"><div class="user" id="brief">做一条 8 秒的雨后城市短片，温暖、有电影感。</div><div class="identity">剑来 <span class="muted" style="font-weight:400">创作助手</span></div><p>我把画面整理成 3 个连续镜头。你可以直接修改镜头内容，再确认生成。</p><div class="plan"><div class="planhead"><strong>雨后的城市</strong><span class="muted" id="summary">3 个镜头 · 8 秒 · 一条完整视频</span></div><div class="shots"><div class="shot"><span class="time">0–2s</span><label>镜头 1 · 开场<textarea aria-label="镜头1" rows="2">雨滴从屋檐落下，地面倒映暖色灯光，低机位缓慢推进。</textarea></label></div><div class="shot"><span class="time">2–5s</span><label>镜头 2 · 展开<textarea aria-label="镜头2" rows="2">镜头抬起，沿湿润街道前移，行人撑伞经过，保持温暖电影色调。</textarea></label></div><div class="shot"><span class="time">5–8s</span><label>镜头 3 · 收束<textarea aria-label="镜头3" rows="2">推近亮着灯的咖啡店窗户，镜头逐渐停稳，窗边热气轻轻上升。</textarea></label></div></div><div class="options"><label>总时长 <select id="duration" onchange="timing()"><option value="4">4 秒</option><option value="8" selected>8 秒</option><option value="12">12 秒</option><option value="15">15 秒</option></select></label><label>画幅 <select><option>16:9</option><option>9:16</option><option>1:1</option></select></label><label>清晰度 <select><option>768P</option><option>2K</option></select></label></div><div class="actions"><span class="muted" id="price">预计 ¥9.60 · ¥1.20 / 秒</span><button class="primary" onclick="demoConfirm()">确认分镜并生成视频</button></div></div><div id="result" class="notice" role="status" hidden></div><form class="composer" onsubmit="revise(event)"><textarea id="message" aria-label="描述你想要的视频" placeholder="描述你想要的视频，或继续调整分镜…" rows="2"></textarea><div class="composerfoot"><span class="hint">首帧参考图沿用现有上传能力</span><button class="primary" type="submit">发送</button></div></form><p class="hint">确认分镜前不提交视频任务。生成完成后，可在作品画廊播放和下载。</p></section>
<section id="gallery" hidden><h2 style="margin:0;font-size:20px">我的作品</h2><p class="muted">图片与视频，统一收在这里。</p><div class="filters" aria-label="媒体筛选"><button aria-pressed="true" onclick="filter('all',this)">全部</button><button aria-pressed="false" onclick="filter('image',this)">图片</button><button aria-pressed="false" onclick="filter('video',this)">视频</button><button aria-pressed="false" onclick="filter('favorites',this)">收藏</button></div><p class="muted">今天</p><div class="grid"><button class="tile" data-kind="video" onclick="openWork('video')"><span class="thumb"><svg viewBox="0 0 48 48"><rect x="4" y="8" width="40" height="32" rx="4"/><path d="m20 16 12 8-12 8z"/></svg><span class="badge">视频 · 8s</span></span><p>雨后的城市</p></button><button class="tile" data-kind="image" onclick="openWork('image')"><span class="thumb"><svg viewBox="0 0 48 48"><rect x="4" y="8" width="40" height="32" rx="4"/><path d="m5 33 11-11 10 9 6-5 11 10"/><circle cx="32" cy="18" r="4"/></svg><span class="badge">图片</span></span><p>雨后的街角</p></button><button class="tile" data-kind="video" onclick="openWork('video')"><span class="thumb"><svg viewBox="0 0 48 48"><rect x="4" y="8" width="40" height="32" rx="4"/><path d="m20 16 12 8-12 8z"/></svg><span class="badge">视频 · 4s</span></span><p>窗边的午后</p></button></div><p id="empty" class="muted" hidden>还没有收藏的图片</p><div class="player" id="player" hidden><div class="screen" id="screen"></div><p class="hint">正式版本在这里使用原生视频控件，保持暂停、声音和全屏操作。</p><button onclick="document.getElementById('player').hidden=true">关闭预览</button></div></section></main></section>
<script>
const $=id=>document.getElementById(id);function view(which){$('video').hidden=which!=='video';$('gallery').hidden=which!=='gallery';$('videoTab').setAttribute('aria-pressed',which==='video');$('galleryTab').setAttribute('aria-pressed',which==='gallery')}
function filter(kind,button){document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b===button));document.querySelectorAll('.tile').forEach(t=>t.hidden=kind==='favorites'||kind!=='all'&&t.dataset.kind!==kind);$('empty').hidden=kind!=='favorites';$('player').hidden=true}
function timing(){let d=+$('duration').value,a=Math.max(1,Math.round(d*.25)),b=Math.max(a+1,Math.round(d*.625));document.querySelectorAll('.time').forEach((e,i)=>e.textContent=([`0–${a}s`,`${a}–${b}s`,`${b}–${d}s`])[i]);$('price').textContent=`预计 ¥${(d*1.2).toFixed(2)} · ¥1.20 / 秒`;$('summary').textContent=`3 个镜头 · ${d} 秒 · 一条完整视频`}
function revise(e){e.preventDefault();if(!$('message').value.trim())return;$('brief').textContent=$('message').value;$('message').value='';$('result').hidden=false;$('result').textContent='样板已收到修改意见。正式版本会由创作助手更新可编辑分镜，仍需确认后才生成视频。'}
function demoConfirm(){$('result').hidden=false;$('result').textContent='样板：这里将提交一条完整视频任务；生成结果进入统一画廊。当前未发起请求、未扣费。'}
function openWork(kind){$('player').hidden=false;$('screen').textContent=kind==='video'?'视频预览区域 · 示例作品，无可播放媒体':'图片预览区域 · 示例作品';$('player').scrollIntoView({block:'nearest',behavior:'instant'})}
</script></body></html>
