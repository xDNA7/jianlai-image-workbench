openapi: 3.1.0
info:
  title: Jianlai Image Workbench API
  version: 2.0.0
  description: Existing Rust/Axum wire contract. Normalized UI models are validated separately; errors
    preserve the existing error field.
servers:
- url: /jianlai
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: Account, capabilities and active job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chat:
    get:
      operationId: getChatUsage
      responses:
        '200':
          description: Daily chat usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUsage'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: streamChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream: {}
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/generate:
    post:
      operationId: createImageJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Created or reused idempotent job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs/{jobId}/images/{index}:
    delete:
      operationId: deleteImage
      parameters: &id001
      - $ref: '#/components/parameters/JobId'
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getOriginalImage
      parameters: *id001
      responses:
        '200':
          description: Authorized original image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/history:
    get:
      operationId: listHistory
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Cursor-paginated history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/templates:
    get:
      operationId: listTemplates
      responses:
        '200':
          description: Public templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Templates'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos:
    get:
      operationId: listVideos
      responses:
        '200':
          description: Video jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Videos'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createVideoJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
      responses:
        '200':
          description: Created or reused video job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos/by-request:
    get:
      operationId: getVideoByRequest
      parameters:
      - name: requestKey
        in: query
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9-]{16,80}$'
      responses:
        '200':
          description: Existing video task for the current account and request key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '404':
          description: No task with this key belongs to the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos/{jobId}:
    get:
      operationId: getVideoJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Video job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs/by-request:
    get:
      operationId: findImageJob
      parameters:
      - name: requestKey
        in: query
        required: true
        schema: &id002
          type: string
      responses:
        '200':
          description: Recover a job without creating or charging it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/users:
    get:
      operationId: listAdminUsers
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsers'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/users/{accountId}/images:
    get:
      operationId: listAdminImages
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      - name: accountId
        in: path
        required: true
        schema: *id002
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImages'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/templates:
    get:
      operationId: listAdminTemplates
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Templates'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/recharge:
    post:
      operationId: rechargeBalance
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requestKey
              - amount
              properties:
                requestKey: *id002
                amount:
                  type: string
                  pattern: ^(0|[1-9]\d{0,7})(\.\d{1,2})?$
      responses:
        '200':
          description: Idempotent recharge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recharge'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/session:
    get:
      operationId: getAdminSession
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    AdminPath:
      name: adminPath
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 100
      description: Deployment-specific management route identifier; no concrete value belongs in this
        document.
  schemas:
    Bootstrap:
      type: object
      required:
      - accountId
      - availableCents
      - capabilities
      properties:
        accountId: *id002
        availableCents: &id007
          type:
          - integer
          - 'null'
          minimum: 0
        balanceCents: &id003
          type: integer
          minimum: 0
        reservedCents: *id003
        balance: &id004
          type: number
        reserved: *id004
        available: *id004
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        imagePriceCents: *id003
        retentionDays: &id005
          type: integer
        videoEnabled: &id006
          type: boolean
        videoPriceCentsPerSecond: *id003
        videoMinSeconds: *id005
        videoMaxSeconds: *id005
        activeJob:
          anyOf:
          - $ref: '#/components/schemas/ActiveImageJob'
          - type: 'null'
        activeVideo:
          anyOf:
          - $ref: '#/components/schemas/VideoJob'
          - type: 'null'
    GenerateRequest:
      type: object
      required:
      - prompt
      - requestKey
      properties:
        prompt:
          type: string
          minLength: 1
        requestKey:
          type: string
          minLength: 16
          maxLength: 100
        size:
          type: string
        quality:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 2
        text: *id002
        references:
          type: array
          items: *id002
        annotations:
          type: array
          items:
            type: object
        mode:
          type: string
          enum:
          - reference
          - blend
          - edit
        compare: *id006
    Error:
      type: object
      required:
      - error
      properties:
        error: *id002
    Ok:
      type: object
      required:
      - ok
      properties:
        ok: *id006
    Health:
      type: object
      required:
      - ok
      - runtime
      - version
      - maintenance
      - database
      properties:
        ok: *id006
        runtime: *id002
        version: *id002
        maintenance: *id006
        database:
          type: string
          enum:
          - postgres
          - sqlite
    Option:
      type: object
      required:
      - value
      - label
      properties:
        value: *id002
        label: *id002
    Capabilities:
      type: object
      required:
      - sizes
      - qualities
      properties:
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        qualities:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        count: *id005
        price: *id003
        editCount: *id005
        editPrice: *id003
        unitPrice: *id003
    JobImage:
      type: object
      required:
      - index
      - url
      properties:
        index:
          type: integer
          minimum: 0
        url: *id002
        previewUrl: &id008
          type:
          - string
          - 'null'
        downloadUrl: *id002
        type: *id002
        created: *id005
        expiresAt: *id005
    ImageJob:
      type: object
      required:
      - id
      - status
      - charged
      - availableCents
      - images
      properties: &id009
        id: *id002
        requestKey: *id002
        status:
          type: string
          enum:
          - running
          - done
          - failed
        phase: *id002
        charged: *id004
        availableCents: *id007
        images:
          type: array
          items:
            $ref: '#/components/schemas/JobImage'
        error: *id002
        created: *id005
        expiresAt: *id005
        count: *id005
        prompt: *id002
        text: *id002
    VideoJob:
      type: object
      required:
      - id
      - status
      properties:
        id: *id002
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        phase: *id002
        created: *id005
        prompt: *id002
        duration: *id005
        ratio: *id002
        resolution: *id002
        url: *id008
        error: *id002
        reservedCents: *id003
        chargedCents: *id003
        providerId: *id008
        progress: *id005
        estimatedSeconds: *id005
        elapsedSeconds: *id005
        availableCents: *id007
        account: *id002
        started:
          type:
          - integer
          - 'null'
    HistoryRecord:
      type: object
      required:
      - id
      - jobId
      - index
      - image
      - created
      properties:
        id: *id002
        jobId: *id002
        index:
          type: integer
          minimum: 0
        image: *id002
        previewUrl: *id008
        downloadUrl: *id002
        prompt: *id002
        text: *id002
        created: *id005
        expiresAt: *id005
        size: *id002
        quality: *id002
        mode: *id002
        supportsFaceSwap: *id006
        faceSwapPrompt: *id002
        annotations:
          type: array
          items:
            type: object
    History:
      type: object
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/HistoryRecord'
        nextCursor: *id008
        total: *id005
        retentionDays: *id005
    Template:
      type: object
      required:
      - id
      - title
      properties:
        id: *id002
        title: *id002
        prompt: *id002
        description: *id002
        text: *id002
        size: *id002
        quality: *id002
        preview: *id002
        category: *id002
        parameterDefaults:
          type: object
          additionalProperties: *id002
    Templates:
      type: object
      required:
      - templates
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    Videos:
      type: object
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/VideoJob'
        retentionDays: *id005
    ChatUsage:
      type: object
      required:
      - used
      - limit
      properties:
        used:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
    ChatRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
              content: *id002
        reference:
          type: object
          required:
          - prompt
          properties:
            prompt: *id002
    VideoRequest:
      type: object
      required:
      - requestKey
      - prompt
      - duration
      - ratio
      - resolution
      properties:
        requestKey: *id002
        prompt: *id002
        duration: *id005
        ratio: *id002
        resolution: *id002
        image: *id002
    AdminStats:
      type: object
      required:
      - userCount
      - jobCount
      - imageCount
      - runningCount
      - templateCount
      - totalCharged
      properties:
        userCount: *id005
        jobCount: *id005
        imageCount: *id005
        runningCount: *id005
        templateCount: *id005
        totalCharged: *id004
    AdminSession:
      type: object
      required:
      - authenticated
      - availableCents
      properties:
        authenticated: *id006
        username: *id002
        csrf: *id002
        expiresAt: *id005
        balanceCents: *id003
        reservedCents: *id003
        availableCents: *id003
        balance: *id004
        reserved: *id004
        available: *id004
        stats:
          $ref: '#/components/schemas/AdminStats'
    AdminUser:
      type: object
      required:
      - id
      - created
      - jobCount
      - totalCharged
      - imageCount
      properties:
        id: *id002
        created:
          type:
          - integer
          - 'null'
        lastCreated:
          type:
          - integer
          - 'null'
        jobCount: *id005
        totalCharged: *id004
        imageCount: *id005
    AdminUsers:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminImage:
      type: object
      required:
      - id
      - jobId
      - index
      - url
      - downloadUrl
      - created
      - expiresAt
      - prompt
      - text
      - hiddenUser
      properties:
        id: *id002
        jobId: *id002
        index: *id005
        url: *id008
        downloadUrl: *id008
        created: *id005
        expiresAt: *id005
        prompt: *id002
        text: *id002
        hiddenUser: *id006
    AdminImages:
      type: object
      required:
      - images
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/AdminImage'
    Recharge:
      type: object
      required:
      - duplicate
      - availableCents
      - recharge
      properties:
        duplicate: *id006
        availableCents: *id003
        balanceCents: *id003
        reservedCents: *id003
        balance: *id004
        reserved: *id004
        available: *id004
        recharge:
          type: object
          required:
          - id
          - amount
          - amountCents
          - created
          properties:
            id: *id002
            amount: *id004
            amountCents: *id003
            created: *id005
    ActiveImageJob:
      type: object
      required:
      - id
      - status
      properties: *id009
