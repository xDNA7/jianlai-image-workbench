openapi: 3.1.0
info:
  title: Jianlai Image Workbench API
  version: 2.0.0
  description: Existing Rust/Axum wire contract. Normalized UI models are validated separately; errors
    preserve the existing error field.
servers:
- url: /jianlai
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: Account, capabilities and active job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chat:
    get:
      operationId: getChatUsage
      responses:
        '200':
          description: Daily chat usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUsage'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: streamChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: >-
            Server-sent events meta/delta/done/error. Default image mode emits a
            validated plan event. Video mode emits a validated storyboard event
            (VideoStoryboard schema), never a generation task. The user must
            explicitly confirm before a separate POST /api/videos. Missing running
            time defaults to 10 seconds; requests above 15 seconds are optimized
            to 15 seconds with a server-generated notice. Existing chat quota and
            concurrency limits apply to both modes. Video mode additionally requires
            the independent internal-video session and an explicit same-origin
            Origin header; a missing or expired session returns 401 before the
            stream starts. Public image mode does not require video access.
          content:
            text/event-stream: {}
        '401':
          description: Ordinary account is missing or video mode lacks a valid internal-video session; no stream is started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/generate:
    post:
      operationId: createImageJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Created or reused idempotent job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs/{jobId}/images/{index}:
    delete:
      operationId: deleteImage
      parameters: &id001
      - $ref: '#/components/parameters/JobId'
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getOriginalImage
      parameters: *id001
      responses:
        '200':
          description: Authorized original image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/history:
    get:
      operationId: listHistory
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Cursor-paginated history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/templates:
    get:
      operationId: listTemplates
      responses:
        '200':
          description: Public templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Templates'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/video-access:
    get:
      operationId: getVideoAccess
      description: >-
        Inspect independent internal-video access for the current ordinary
        account. An automatic ordinary account alone is not internal access.
        Video sessions are account-bound, last eight hours and are lost on
        server restart or credential rotation. Responses are not cacheable.
      security:
      - AccountSession: []
      responses:
        '200':
          description: Internal-video access state; expiresAt is null when not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAccess'
        '401':
          description: Ordinary account session is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: signInVideoAccess
      description: >-
        Verify the shared internal-video password without granting administrator
        privileges. Requires the current ordinary account and an explicit
        same-origin Origin header. Sets an opaque HttpOnly, Secure,
        SameSite=Strict cookie at Path=/ for eight hours. Five failed attempts
        per peer address within fifteen minutes are rate-limited. Neither the
        submitted password nor a session token is returned in JSON.
      security:
      - AccountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoAccessLogin'
      responses:
        '200':
          description: Internal-video access granted; sets the video session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAccess'
        '401':
          description: Ordinary account is missing or the internal password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin is absent or not same-origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Internal access is unconfigured or the session capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: signOutVideoAccess
      description: >-
        Revoke the current internal-video session and expire its cookie. Requires
        the ordinary account and an explicit same-origin Origin header; it is
        idempotent when there is no current internal-video session. Does not
        revoke the ordinary account or affect public image creation.
      security:
      - AccountSession: []
      responses:
        '200':
          description: Video access revoked; authenticated is false and expiresAt is null
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAccess'
        '401':
          description: Ordinary account session is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin is absent or not same-origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos:
    get:
      operationId: listVideos
      description: Requires the ordinary account and independent internal-video session; jobs remain isolated to their owning account.
      security:
      - AccountSession: []
        VideoSession: []
      responses:
        '200':
          description: Video jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Videos'
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createVideoJob
      description: Requires the ordinary account and independent internal-video session; jobs remain isolated to their owning account. A same-origin Origin header is mandatory before task creation and billing.
      security:
      - AccountSession: []
        VideoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
      responses:
        '200':
          description: Reused idempotent video job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '202':
          description: New video task accepted and reserved for generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos/by-request:
    get:
      operationId: getVideoByRequest
      description: Requires the ordinary account and independent internal-video session; jobs remain isolated to their owning account.
      security:
      - AccountSession: []
        VideoSession: []
      parameters:
      - name: requestKey
        in: query
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9-]{16,80}$'
      responses:
        '200':
          description: Existing video task for the current account and request key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No task with this key belongs to the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos/{jobId}:
    get:
      operationId: getVideoJob
      description: Requires the ordinary account and independent internal-video session; jobs remain isolated to their owning account.
      security:
      - AccountSession: []
        VideoSession: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Video job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/videos/{jobId}/media:
    parameters:
    - $ref: '#/components/parameters/JobId'
    - name: Range
      in: header
      description: Optional byte range forwarded to private object storage
      schema:
        type: string
    - name: If-Range
      in: header
      description: Optional conditional range validator forwarded to object storage
      schema:
        type: string
    get:
      operationId: getVideoMedia
      description: >-
        Internal-session and ordinary-account ownership checked on every request.
        Proxies private stored video bytes without exposing object-storage or
        signed URLs. Successful responses use video/mp4, Cache-Control:
        private, no-store and Content-Disposition: inline. HEAD has no body.
      security:
      - AccountSession: []
        VideoSession: []
      responses:
        '200':
          description: Complete video bytes
          headers: &videoMediaHeaders
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Content-Length:
              schema:
                type: integer
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range; HEAD returns headers only
          headers: *videoMediaHeaders
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Completed video does not belong to the current account or has no stored file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Stored video address cannot be safely mapped to its private object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Private video storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '416':
          description: Object storage rejected the requested byte range; no JSON error shape is promised
          headers: *videoMediaHeaders
    head:
      operationId: headVideoMedia
      description: >-
        Same internal access and account ownership checks as GET. Returns video
        headers with no response body; never exposes a storage or signed URL.
      security:
      - AccountSession: []
        VideoSession: []
      responses:
        '200':
          description: Complete video headers; Cache-Control is private, no-store
          headers: *videoMediaHeaders
        '206':
          description: Requested byte range; HEAD returns headers only
          headers: *videoMediaHeaders
        '401':
          description: Ordinary account or internal-video session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Completed video does not belong to the current account or has no stored file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Stored video address cannot be safely mapped to its private object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Private video storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '416':
          description: Object storage rejected the requested byte range; no JSON error shape is promised
          headers: *videoMediaHeaders
  /api/jobs/by-request:
    get:
      operationId: findImageJob
      parameters:
      - name: requestKey
        in: query
        required: true
        schema: &id002
          type: string
      responses:
        '200':
          description: Recover a job without creating or charging it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/users:
    get:
      operationId: listAdminUsers
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsers'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/users/{accountId}/images:
    get:
      operationId: listAdminImages
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      - name: accountId
        in: path
        required: true
        schema: *id002
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImages'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/templates:
    get:
      operationId: listAdminTemplates
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Templates'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/recharge:
    post:
      operationId: rechargeBalance
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requestKey
              - amount
              properties:
                requestKey: *id002
                amount:
                  type: string
                  pattern: ^(0|[1-9]\d{0,7})(\.\d{1,2})?$
      responses:
        '200':
          description: Idempotent recharge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recharge'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{adminPath}/session:
    get:
      operationId: getAdminSession
      parameters:
      - $ref: '#/components/parameters/AdminPath'
      responses:
        '200':
          description: Authenticated management response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        default:
          description: Existing JSON error response; status varies by authentication, validation, quota
            and provider failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    AccountSession:
      type: apiKey
      in: cookie
      name: jianlai_session
      description: Ordinary account cookie established by bootstrap; not internal authorization
    VideoSession:
      type: apiKey
      in: cookie
      name: jianlai_video_session
      description: Opaque account-bound internal-video cookie, established by signInVideoAccess
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    AdminPath:
      name: adminPath
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 100
      description: Deployment-specific management route identifier; no concrete value belongs in this
        document.
  schemas:
    VideoAccess:
      type: object
      required:
      - authenticated
      - expiresAt
      - enabled
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: [integer, 'null']
          description: Session expiry as Unix milliseconds; null when not authenticated
        enabled:
          type: boolean
          description: Whether the server has valid internal-video credential configuration
    VideoAccessLogin:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Shared internal-video password, at most 2048 UTF-8 bytes
    Bootstrap:
      type: object
      required:
      - accountId
      - availableCents
      - capabilities
      properties:
        accountId: *id002
        availableCents: &id007
          type:
          - integer
          - 'null'
          minimum: 0
        balanceCents: &id003
          type: integer
          minimum: 0
        reservedCents: *id003
        balance: &id004
          type: number
        reserved: *id004
        available: *id004
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        imagePriceCents: *id003
        retentionDays: &id005
          type: integer
        videoEnabled: &id006
          type: boolean
        videoPriceCentsPerSecond: *id003
        videoMinSeconds: *id005
        videoMaxSeconds: *id005
        activeJob:
          anyOf:
          - $ref: '#/components/schemas/ActiveImageJob'
          - type: 'null'
        activeVideo:
          description: Null unless the current account has a valid independent internal-video session
          anyOf:
          - $ref: '#/components/schemas/VideoJob'
          - type: 'null'
    AnimationPlan:
      type: object
      required: [fps, durationSeconds, frames]
      properties:
        fps:
          type: number
          const: 4
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 6
        frames:
          type: integer
          minimum: 4
          maximum: 24
        notice:
          type: string
    AnimationMetadata:
      type: [object, 'null']
      required: [frames, durationMs, fps, width, height]
      properties:
        frames:
          type: integer
          minimum: 1
        durationMs:
          type: number
          minimum: 0
        fps:
          type: number
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    GenerateRequest:
      type: object
      required:
      - prompt
      - requestKey
      properties:
        prompt:
          type: string
          minLength: 1
        requestKey:
          type: string
          minLength: 16
          maxLength: 100
        size:
          type: string
        quality:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 2
        text: *id002
        references:
          type: array
          items: *id002
        annotations:
          type: array
          items:
            type: object
        mode:
          type: string
          enum:
          - reference
          - blend
          - edit
        compare: *id006
        animation:
          $ref: '#/components/schemas/AnimationPlan'
    Error:
      type: object
      required:
      - error
      properties:
        error: *id002
    Ok:
      type: object
      required:
      - ok
      properties:
        ok: *id006
    Health:
      type: object
      required:
      - ok
      - runtime
      - version
      - maintenance
      - database
      properties:
        ok: *id006
        runtime: *id002
        version: *id002
        maintenance: *id006
        database:
          type: string
          enum:
          - postgres
          - sqlite
    Option:
      type: object
      required:
      - value
      - label
      properties:
        value: *id002
        label: *id002
    Capabilities:
      type: object
      required:
      - sizes
      - qualities
      properties:
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        qualities:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        count: *id005
        price: *id003
        editCount: *id005
        editPrice: *id003
        unitPrice: *id003
    JobImage:
      type: object
      required:
      - index
      - url
      properties:
        index:
          type: integer
          minimum: 0
        url: *id002
        previewUrl: &id008
          type:
          - string
          - 'null'
        downloadUrl: *id002
        type: *id002
        animation:
          $ref: '#/components/schemas/AnimationMetadata'
        created: *id005
        expiresAt: *id005
    ImageJob:
      type: object
      required:
      - id
      - status
      - charged
      - availableCents
      - images
      properties: &id009
        id: *id002
        requestKey: *id002
        status:
          type: string
          enum:
          - running
          - done
          - failed
        phase: *id002
        charged: *id004
        availableCents: *id007
        images:
          type: array
          items:
            $ref: '#/components/schemas/JobImage'
        error: *id002
        created: *id005
        expiresAt: *id005
        count: *id005
        prompt: *id002
        text: *id002
    VideoJob:
